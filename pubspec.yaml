name: my_lints
description: Custom lint rules for Dart and Flutter using the Dart analysis server plugin API.
version: 0.0.1
homepage: https://github.com/lcouturier/my_lints
repository: https://github.com/lcouturier/my_lints
issue_tracker: https://github.com/lcouturier/my_lints/issues
topics:
  - dart
  - flutter
  - lints
  - analyzer-plugin

environment:
  sdk: ^3.11.5

dependencies:
  analysis_server_plugin: ^0.3.3
  analyzer_plugin: ^0.13.10
  analyzer: ^8.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.0
